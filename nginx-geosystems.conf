# Bloque a agregar dentro de server { } en /etc/nginx/sites-available/default
# Agregue estas líneas ANTES del bloque location / {}

location /send.py {
    proxy_pass         http://127.0.0.1:5000;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
}
